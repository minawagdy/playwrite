name: Playwright Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: true
      # Remove FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 - not needed with Node.js 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4  # Using v4 (stable with Node.js 20)

      - name: Setup Node.js
        uses: actions/setup-node@v4  # Using v4 (stable with Node.js 20)
        with:
          node-version: 20  # Using Node.js 20 (LTS)
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        id: playwright
        run: |
          npx playwright test \
            --reporter=html,line \
            --trace=retain-on-failure \
            --retries=1
        continue-on-error: true

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Fail Workflow If Tests Failed
        if: steps.playwright.outcome == 'failure'
        run: exit 1